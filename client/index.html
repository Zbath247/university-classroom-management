<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1e40af" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DUC Classroom" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="apple-touch-icon" href="/assets/duc-logo.png" />
  <title>University Classroom Management System</title>
  <meta name="description" content="University Classroom Management System — Digital University of Cambodia, G1-NW-B" />
  <link rel="icon" type="image/png" href="/assets/duc-logo.png" />
  <link rel="stylesheet" href="/css/style.css?v=2.6" />
  <style>
    /* Quick redirect page — shows briefly before redirecting */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #2563eb 100%);
    }

    .redirect-box {
      text-align: center;
      color: white;
      animation: fadeIn 0.5s ease;
    }

    .redirect-logo {
      margin-bottom: 1.25rem;
    }

    .redirect-logo img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      filter: drop-shadow(0 8px 24px rgba(0,0,0,0.35));
    }

    .redirect-title {
      font-family: var(--font-moul);
      font-size: 1.5rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
      color: white;
    }

    .redirect-subtitle {
      font-family: var(--font-battambang);
      font-size: 1rem;
      opacity: 0.8;
      margin-bottom: 2rem;
    }

    .redirect-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="redirect-box">
    <div class="redirect-logo">
      <img src="/assets/duc-logo.png" alt="Digital University of Cambodia Logo" />
    </div>
    <h1 class="redirect-title">ប្រព័ន្ធគ្រប់គ្រងថ្នាក់រៀន</h1>
    <p class="redirect-subtitle">Digital University of Cambodia · G1-NW-B</p>
    <div class="redirect-spinner"></div>
  </div>

  <script src="/js/api.js?v=2.6"></script>
  <script>
    // If already logged in, go to dashboard. Otherwise go to login.
    if (isLoggedIn()) {
      redirectToDashboard();
    } else {
      window.location.href = '/login.html';
    }

    function redirectToDashboard() {
      const role = getUserRole();
      const routes = {
        admin:   '/admin/dashboard.html',
        teacher: '/teacher/dashboard.html',
        student: '/student/dashboard.html'
      };
      window.location.href = routes[role] || '/login.html';
    }
  </script>
</body>
</html>
